<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزانيتي</title>
<meta name="theme-color" content="#4b32c3">
<meta name="description" content="تطبيق لتسجيل الدخل والمصروفات اليومية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Tajawal","Noto Sans Arabic","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#f3f0fb;color:#1f1b3a;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffd43b;outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px calc(40px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:30px;font-weight:800;color:#3b2a9e}
.sub{margin:2px 0 10px;color:#6a5fb0;font-size:15px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;white-space:nowrap;background:#fff;color:#4a3fa0;box-shadow:0 1px 3px rgba(60,40,140,.15)}
.chip[aria-pressed=true]{background:#4b32c3;color:#fff}
.card{border-radius:28px;padding:20px;color:#fff;margin-bottom:18px}
.card h2{margin:0;font-size:22px;font-weight:800}
.hint{margin:4px 0 0;opacity:.85;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.small{font-size:13px;opacity:.85}
.field{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:#fff;color:#1f1b3a}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px}
.cat{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:8px 12px;font-size:14px;font-weight:700}
.cat[aria-pressed=true]{background:#fff;border-color:#fff;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{margin-top:10px;width:100%;border:0;border-radius:16px;padding:13px;background:#fff;color:var(--accent);font-size:17px;font-weight:800}
.add:active{transform:scale(.98)}
.brk{margin-top:20px}
.brk .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.brk>div{margin-bottom:9px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:#fff}
.list{margin-top:18px}
.day{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin:0 4px 6px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border-radius:16px;padding:10px 12px;margin-bottom:6px}
.row .e{font-size:22px}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{display:block;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:0;background:rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;font-size:14px;flex:none}
.empty{text-align:center;opacity:.85;margin:12px 0 0;font-size:14px}
.sum{background:linear-gradient(135deg,#6d4df2,#3b2a9e);box-shadow:0 14px 30px #5b3fd655}
.inc{background:linear-gradient(135deg,#10b981,#087f5b);box-shadow:0 14px 30px #08a37855;--accent:#087f5b}
.exp{background:linear-gradient(135deg,#ff6b6b,#d6336c);box-shadow:0 14px 30px #d6336c55;--accent:#c2255c}
.yr{background:linear-gradient(135deg,#1c9be6,#0b4f9c);box-shadow:0 14px 30px #1c7ed655}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:rgba(255,255,255,.16);border-radius:18px;padding:12px}
.tile .n{font-size:20px;font-weight:800}
.g{color:#7cf5c2}.r{color:#ffb4a8}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:16px 0 12px;background:rgba(255,255,255,.2)}
.split i{display:block;background:#34d399}
.split b{flex:1;background:#fb7185}
.diff{background:#fff;border-radius:18px;padding:12px 14px}
.diff .k{font-size:14px;font-weight:700}
.diff .v{font-size:28px;font-weight:800}
.diff.pos{color:#0b7a5c}.diff.neg{color:#c2255c}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:13px}
.tops span{opacity:.85}
.chart{display:flex;gap:3px;align-items:flex-end;height:130px;margin-top:18px}
.chart button{flex:1;height:100%;border:0;padding:0 1px;background:transparent;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart button[aria-pressed=true]{background:rgba(255,255,255,.22)}
.chart i{display:block;width:42%;border-radius:4px 4px 0 0}
.labels{display:flex;gap:3px;margin-top:4px}
.labels div{flex:1;text-align:center;font-size:9px;opacity:.9}
.years{display:flex;gap:3px;margin-top:4px;font-size:12px;font-weight:700}
.years div{text-align:center;border-top:2px solid rgba(255,255,255,.5);padding-top:3px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:13px}
.tbl .row{cursor:pointer;font-size:14px}
.tbl .m{width:96px;font-weight:700}
.tbl .a{flex:1}
.tbl .b{width:84px;text-align:left;font-weight:700}
.foot{text-align:center;font-size:14px}
.link{border:0;background:transparent;color:#8a80c4;font-size:14px;text-decoration:underline}
.mini{border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1f1b3a;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ميزانيتي</h1>
    <p class="sub">من أكتوبر ٢٠٢٦ حتى ديسمبر ٢٠٢٧</p>
  </header>

  <nav class="scroll" id="months" aria-label="اختيار الشهر"></nav>

  <section class="card sum" id="summary"></section>

  <section class="card inc" id="card-in"></section>
  <section class="card exp" id="card-out"></section>

  <section class="card yr" id="year"></section>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var CURRENCY = "ج.م";
  var STORE_KEY = "budget-data-v1";
  var MN = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var SH = ["ينا","فبر","مار","أبر","ماي","يون","يول","أغس","سبت","أكت","نوف","ديس"];

  var CATS = {
    "in": [
      { k: "salary", label: "مرتب", emoji: "💼" },
      { k: "lessons", label: "دروس", emoji: "📚" },
      { k: "extra", label: "شغل إضافي", emoji: "🛠️" },
      { k: "other_in", label: "دخل آخر", emoji: "✨" }
    ],
    "out": [
      { k: "transport", label: "مواصلات", emoji: "🚌" },
      { k: "food", label: "أكل", emoji: "🍽️" },
      { k: "tea", label: "سكر وشاي", emoji: "☕" },
      { k: "bills", label: "فواتير", emoji: "💡" },
      { k: "clothes", label: "ملابس", emoji: "👕" },
      { k: "health", label: "صحة", emoji: "💊" },
      { k: "other_out", label: "أخرى", emoji: "🧾" }
    ]
  };
  var CARD_TEXT = {
    "in": { title: "الدخل", hint: "مرتب، دروس، شغل إضافي وأي دخل آخر", add: "+ إضافة دخل" },
    "out": { title: "المنصرف اليومي", hint: "مواصلات، أكل، سكر وشاي وغيرها", add: "+ إضافة مصروف" }
  };

  function catOf(k) {
    var all = CATS["in"].concat(CATS["out"]);
    for (var i = 0; i < all.length; i++) if (all[i].k === k) return all[i];
    return { label: k, emoji: "•" };
  }

  /* ---------- الفترة: أكتوبر 2026 → ديسمبر 2027 ---------- */
  var PERIODS = [];
  for (var y = 2026; y <= 2027; y++) {
    for (var m = (y === 2026 ? 9 : 0); m < 12; m++) {
      PERIODS.push({ y: y, m: m, name: MN[m], short: SH[m], prefix: y + "-" + pad(m + 1) });
    }
  }
  var FIRST = PERIODS[0].prefix + "-01";
  var LAST = "2027-12-31";

  /* ---------- أدوات ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function arDigits(n) { return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[d]; }); }
  var nf = new Intl.NumberFormat("ar-EG", { maximumFractionDigits: 2 });
  function fmt(n) { return nf.format(Math.round(n * 100) / 100); }
  function money(n) { return fmt(n) + " " + CURRENCY; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseAmount(v) {
    var s = String(v)
      .replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
      .replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); })
      .replace(/[٫,،]/g, ".")
      .replace(/[^\d.]/g, "");
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  function sum(arr) { return arr.reduce(function (s, e) { return s + e.amount; }, 0); }
  function byCat(arr) {
    var o = {};
    arr.forEach(function (e) { o[e.cat] = (o[e.cat] || 0) + e.amount; });
    return Object.keys(o).map(function (k) { return [k, o[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }
  function defaultDate(idx) {
    var p = PERIODS[idx], t = new Date();
    if (t.getFullYear() === p.y && t.getMonth() === p.m) return p.prefix + "-" + pad(t.getDate());
    return p.prefix + "-01";
  }
  function dayLabel(d) {
    return new Date(d + "T00:00:00").toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
  }
  function $(id) { return document.getElementById(id); }

  /* ---------- الحفظ ---------- */
  var entries = [];
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) entries = JSON.parse(raw) || [];
  } catch (e) { entries = []; }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch (e) { toast("تعذّر الحفظ على هذا الجهاز"); }
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  /* ---------- الحالة ---------- */
  var now = new Date();
  var month = 0;
  PERIODS.forEach(function (p, i) { if (p.y === now.getFullYear() && p.m === now.getMonth()) month = i; });
  var selected = { "in": "salary", "out": "transport" };
  var confirmReset = false;

  /* ---------- بناء البطاقات الثابتة (النماذج) ---------- */
  function buildCard(type) {
    var t = CARD_TEXT[type];
    $("card-" + type).innerHTML =
      '<div class="top"><div><h2>' + t.title + '</h2><p class="hint">' + t.hint + '</p></div>' +
      '<div><div class="big" id="total-' + type + '"></div><div class="small">' + CURRENCY + ' هذا الشهر</div></div></div>' +
      '<div class="cats" id="cats-' + type + '"></div>' +
      '<div class="grid2">' +
        '<input class="field" id="amt-' + type + '" type="text" inputmode="decimal" placeholder="المبلغ" aria-label="المبلغ" autocomplete="off">' +
        '<input class="field" id="date-' + type + '" type="date" aria-label="التاريخ" min="' + FIRST + '" max="' + LAST + '">' +
      '</div>' +
      '<input class="field" id="note-' + type + '" style="margin-top:8px" placeholder="ملاحظة (اختياري)" aria-label="ملاحظة" autocomplete="off">' +
      '<button class="add" id="add-' + type + '">' + t.add + '</button>' +
      '<div class="brk" id="brk-' + type + '"></div>' +
      '<div class="list" id="list-' + type + '"></div>';

    ["amt", "note"].forEach(function (p) {
      $(p + "-" + type).addEventListener("keydown", function (ev) { if (ev.key === "Enter") submit(type); });
    });
    $("add-" + type).addEventListener("click", function () { submit(type); });
    $("cats-" + type).addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-cat]");
      if (!b) return;
      selected[type] = b.getAttribute("data-cat");
      renderCats(type);
    });
  }

  function renderCats(type) {
    $("cats-" + type).innerHTML = CATS[type].map(function (c) {
      return '<button class="cat" data-cat="' + c.k + '" aria-pressed="' + (selected[type] === c.k) + '">' + c.emoji + " " + c.label + "</button>";
    }).join("");
  }

  function submit(type) {
    var a = parseAmount($("amt-" + type).value);
    var d = $("date-" + type).value;
    if (!a || a <= 0) { toast("اكتب المبلغ أولًا"); $("amt-" + type).focus(); return; }
    if (!d || d < FIRST || d > LAST) { toast("اختر تاريخًا من أكتوبر ٢٠٢٦ حتى ديسمبر ٢٠٢٧"); return; }
    entries.push({
      id: Date.now() + Math.random(),
      type: type,
      cat: selected[type],
      amount: a,
      note: $("note-" + type).value.trim(),
      date: d
    });
    save();
    $("amt-" + type).value = "";
    $("note-" + type).value = "";
    var idx = PERIODS.findIndex(function (p) { return d.indexOf(p.prefix) === 0; });
    if (idx >= 0 && idx !== month) { month = idx; resetDates(); }
    toast("تمت الإضافة");
    render();
  }

  function resetDates() {
    ["in", "out"].forEach(function (t) { $("date-" + t).value = defaultDate(month); });
  }

  /* ---------- الرسم الديناميكي ---------- */
  function monthEntries() {
    var pre = PERIODS[month].prefix;
    return entries.filter(function (e) { return e.date.indexOf(pre) === 0; });
  }

  function renderMonths() {
    var nav = $("months");
    nav.innerHTML = PERIODS.map(function (p, i) {
      return '<button class="chip" data-m="' + i + '" aria-pressed="' + (month === i) + '">' + p.name + " " + arDigits(p.y) + "</button>";
    }).join("");
    var sel = nav.querySelector('[aria-pressed="true"]');
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function renderSummary(inList, outList) {
    var inT = sum(inList), outT = sum(outList), diff = inT - outT;
    var topIn = byCat(inList)[0], topOut = byCat(outList)[0];
    var pct = inT + outT > 0 ? (inT / (inT + outT)) * 100 : 50;
    var msg = (inT === 0 && outT === 0) ? "لا توجد حركات بعد"
      : diff > 0 ? "الدخل أكبر من المنصرف — الفارق (وفر)"
      : diff < 0 ? "المنصرف أكبر من الدخل — الفارق (عجز)"
      : "الدخل والمنصرف متساويان";
    var tops = "";
    if (topIn || topOut) {
      tops = '<div class="tops"><div><span>أكبر دخل: </span><b>' +
        (topIn ? catOf(topIn[0]).emoji + " " + catOf(topIn[0]).label : "—") +
        '</b></div><div><span>أكثر منصرف: </span><b>' +
        (topOut ? catOf(topOut[0]).emoji + " " + catOf(topOut[0]).label : "—") + "</b></div></div>";
    }
    $("summary").innerHTML =
      '<h2>إجمالي ' + PERIODS[month].name + " " + arDigits(PERIODS[month].y) + "</h2>" +
      '<div class="tiles"><div class="tile"><div class="small">الدخل</div><div class="n g">' + money(inT) + "</div></div>" +
      '<div class="tile"><div class="small">المنصرف</div><div class="n r">' + money(outT) + "</div></div></div>" +
      '<div class="split"><i style="width:' + pct + '%"></i><b></b></div>' +
      '<div class="diff ' + (diff >= 0 ? "pos" : "neg") + '"><div class="k">' + msg + '</div><div class="v">' + money(Math.abs(diff)) + "</div></div>" +
      tops;
  }

  function renderCard(type, list) {
    var total = sum(list);
    $("total-" + type).textContent = fmt(total);
    renderCats(type);

    $("brk-" + type).innerHTML = byCat(list).map(function (kv) {
      var c = catOf(kv[0]);
      return '<div><div class="l"><span>' + c.emoji + " " + c.label + "</span><b>" + money(kv[1]) +
        '</b></div><div class="bar"><div style="width:' + (kv[1] / total) * 100 + '%"></div></div></div>';
    }).join("");

    var groups = {};
    list.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (e) {
      (groups[e.date] = groups[e.date] || []).push(e);
    });
    var days = Object.keys(groups).sort().reverse();
    if (!days.length) {
      $("list-" + type).innerHTML = '<p class="empty">لا توجد حركات في هذا الشهر. اختر بندًا وأضف أول مبلغ.</p>';
      return;
    }
    $("list-" + type).innerHTML = days.map(function (d) {
      return '<div style="margin-bottom:10px"><div class="day"><span>' + dayLabel(d) + "</span><b>" + money(sum(groups[d])) + "</b></div>" +
        groups[d].map(function (e) {
          var c = catOf(e.cat);
          return '<div class="row"><span class="e">' + c.emoji + '</span><div class="t"><b>' + c.label + "</b>" +
            (e.note ? "<span>" + esc(e.note) + "</span>" : "") + "</div><b>" + money(e.amount) +
            '</b><button class="del" data-del="' + e.id + '" aria-label="حذف">✕</button></div>';
        }).join("") + "</div>";
    }).join("");
  }

  function renderYear() {
    var data = PERIODS.map(function (p) {
      var list = entries.filter(function (e) { return e.date.indexOf(p.prefix) === 0; });
      var inc = sum(list.filter(function (e) { return e.type === "in"; }));
      var exp = sum(list.filter(function (e) { return e.type === "out"; }));
      return { inc: inc, exp: exp, bal: inc - exp };
    });
    var yIn = data.reduce(function (s, d) { return s + d.inc; }, 0);
    var yOut = data.reduce(function (s, d) { return s + d.exp; }, 0);
    var bal = yIn - yOut;
    var has = data.some(function (d) { return d.inc || d.exp; });
    var maxBar = Math.max.apply(null, [1].concat(data.map(function (d) { return Math.max(d.inc, d.exp); })));
    var best = -1;
    if (has) { best = 0; data.forEach(function (d, i) { if (d.bal > data[best].bal) best = i; }); }
    var rate = yIn > 0 ? Math.round((bal / yIn) * 100) : 0;
    var n26 = PERIODS.filter(function (p) { return p.y === 2026; }).length;
    var n27 = PERIODS.length - n26;

    $("year").innerHTML =
      "<h2>النتيجة الإجمالية حتى نهاية ٢٠٢٧</h2>" +
      '<p class="hint">من أكتوبر ٢٠٢٦ حتى ديسمبر ٢٠٢٧</p>' +
      '<div class="diff ' + (bal >= 0 ? "pos" : "neg") + '" style="margin:14px 0;border-radius:20px;padding:14px 16px">' +
        '<div class="k">' + (!has ? "صافي الفترة" : bal >= 0 ? "صافي الفترة (وفر)" : "صافي الفترة (عجز)") + "</div>" +
        '<div class="v" style="font-size:32px">' + money(Math.abs(bal)) + "</div>" +
        (has && yIn > 0 ? '<div style="font-size:13px;color:#5b5680">نسبة الوفر من الدخل: ' + fmt(rate) + "٪</div>" : "") +
      "</div>" +
      '<div class="tiles" style="margin-top:0"><div class="tile"><div class="small">إجمالي الدخل</div><div class="n g">' + money(yIn) + "</div></div>" +
      '<div class="tile"><div class="small">إجمالي المنصرف</div><div class="n r">' + money(yOut) + "</div></div></div>" +
      (best >= 0 ? '<p style="margin:12px 2px 0;font-size:14px">أفضل شهر: <b>' + PERIODS[best].name + " " + arDigits(PERIODS[best].y) + "</b> بوفر " + money(data[best].bal) + "</p>" : "") +
      '<div class="chart">' + data.map(function (d, i) {
        return '<button data-m="' + i + '" aria-pressed="' + (month === i) + '" aria-label="' + PERIODS[i].name + " " + arDigits(PERIODS[i].y) + '">' +
          '<i style="height:' + (d.inc / maxBar) * 100 + "%;min-height:" + (d.inc ? 3 : 0) + 'px;background:#34d399"></i>' +
          '<i style="height:' + (d.exp / maxBar) * 100 + "%;min-height:" + (d.exp ? 3 : 0) + 'px;background:#ff8787"></i></button>';
      }).join("") + "</div>" +
      '<div class="labels">' + PERIODS.map(function (p) { return "<div>" + p.short + "</div>"; }).join("") + "</div>" +
      '<div class="years"><div style="flex:' + n26 + '">٢٠٢٦</div><div style="flex:' + n27 + '">٢٠٢٧</div></div>' +
      '<div class="legend"><span><span class="g" style="color:#34d399">■</span> دخل</span><span><span style="color:#ff8787">■</span> منصرف</span></div>' +
      '<div class="tbl" style="margin-top:16px">' + data.map(function (d, i) {
        if (!d.inc && !d.exp) return "";
        return '<div class="row" data-m="' + i + '"><span class="m">' + PERIODS[i].name + " " + arDigits(PERIODS[i].y) + '</span>' +
          '<span class="a" style="color:#b9f8dc">' + fmt(d.inc) + '</span><span class="a" style="color:#ffc9c2">' + fmt(d.exp) + "</span>" +
          '<span class="b">' + (d.bal >= 0 ? "+" : "−") + fmt(Math.abs(d.bal)) + "</span></div>";
      }).join("") + "</div>";
  }

  function renderFoot() {
    $("foot").innerHTML = confirmReset
      ? '<span style="color:#c2255c">سيتم حذف كل الحركات نهائيًا. </span>' +
        '<button class="mini" id="reset-yes" style="background:#c2255c;color:#fff">نعم، احذف</button> ' +
        '<button class="mini" id="reset-no" style="background:#e5e0f7;color:#3b2a9e">إلغاء</button>'
      : '<button class="link" id="reset-ask">مسح كل البيانات</button>';
  }

  function render() {
    var list = monthEntries();
    var inList = list.filter(function (e) { return e.type === "in"; });
    var outList = list.filter(function (e) { return e.type === "out"; });
    renderMonths();
    renderSummary(inList, outList);
    renderCard("in", inList);
    renderCard("out", outList);
    renderYear();
    renderFoot();
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var m = t.closest && t.closest("[data-m]");
    if (m) {
      month = parseInt(m.getAttribute("data-m"), 10);
      resetDates();
      render();
      if (m.closest("#year")) window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    var d = t.closest && t.closest("[data-del]");
    if (d) {
      var id = parseFloat(d.getAttribute("data-del"));
      entries = entries.filter(function (e) { return e.id !== id; });
      save();
      toast("تم الحذف");
      render();
      return;
    }
    if (t.id === "reset-ask") { confirmReset = true; renderFoot(); }
    else if (t.id === "reset-no") { confirmReset = false; renderFoot(); }
    else if (t.id === "reset-yes") {
      entries = []; save(); confirmReset = false; toast("تم مسح البيانات"); render();
    }
  });

  buildCard("in");
  buildCard("out");
  resetDates();
  render();

  /* ---------- العمل بدون إنترنت ---------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
